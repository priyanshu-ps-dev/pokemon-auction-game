name: Pokemon Game CI-CD Pipeline

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

jobs:
  test-job:
    runs-on: ubuntu-latest
    steps:
      - name: Code download karo
        uses: actions/checkout@v4

      - name: Python 3 setup karo
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencies install karo
        run: pip install -r requirements.txt

      - name: Run arena regressions
        env:
          PYTHONPATH: tests:.
        run: >-
          python -m unittest
          test_arena_overhaul
          test_4player_manual_pvp
          test_auction_reliability_phase7
          test_battle_engine_phase2
          test_combat_data_phase1
          test_database_upgrade_and_pokedex
          test_skip_withdraw_rematch
          test_marvel_combat

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Check frontend bundle
        run: git diff --exit-code -- public/assets/tear-ticket-bundle.js public/assets/tear-ticket-bundle.css

  deploy-job:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test-job
    runs-on: self-hosted

    steps:
      - name: Latest code checkout karo
        uses: actions/checkout@v4

      - name: Dependencies install karo
        run: pip install -r requirements.txt --break-system-packages

      - name: Pokemon Server Start/Restart karo via PM2 (Port 5050)
        run: |
          pm2 restart pokemon-game || pm2 start "python3 server.py" --name "pokemon-game"
